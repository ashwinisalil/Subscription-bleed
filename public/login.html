<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Bleed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<script src="sound.js"></script>
<style>
  body{ overflow:hidden; }
  .stage{
    min-height:100vh; height:100vh; position:relative; overflow:hidden;
    background:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .skip-btn{
    position:fixed; top:26px; right:28px; z-index:60;
    background:rgba(18,18,22,0.6); border:1px solid rgba(242,236,230,0.18);
    color:#9A97A0; font-size:13px; padding:9px 16px; border-radius:20px;
    cursor:pointer; backdrop-filter:blur(6px);
    transition:color .2s ease, border-color .2s ease;
  }
  .skip-btn:hover{ color:#F2ECE6; border-color:#9A97A0; }

  .room{ position:absolute; inset:0; perspective:1100px; overflow:hidden; }
  .backdrop{
    position:absolute; inset:0;
    background:radial-gradient(ellipse 60% 50% at 74% 60%, #17131a 0%, #0B0B0E 62%);
    transition:background 1.1s ease;
  }
  .room.lit .backdrop{
    background:radial-gradient(ellipse 65% 55% at 74% 58%, rgba(232,163,77,0.22) 0%, rgba(122,18,48,0.06) 38%, #0B0B0E 68%);
  }
  .floor{
    position:absolute; left:0; right:0; bottom:0; height:34%;
    background:linear-gradient(180deg, rgba(255,255,255,0.025), transparent);
    border-top:1px solid var(--line);
  }
  .stars{ position:absolute; inset:0; }
  .stars span{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:rgba(242,236,230,0.35);
  }

  /* ---------- DESK & LAMP ---------- */
  .desk{
    position:absolute; right:9%; bottom:24%;
    width:190px; height:14px; border-radius:3px;
    background:linear-gradient(180deg, #2A2129, #17121A);
    box-shadow:0 18px 30px -10px rgba(0,0,0,0.6);
  }
  .desk::before{
    content:''; position:absolute; left:8px; bottom:-64px; width:10px; height:64px;
    background:linear-gradient(180deg, #241C22, #120E12);
  }
  .desk::after{
    content:''; position:absolute; right:8px; bottom:-64px; width:10px; height:64px;
    background:linear-gradient(180deg, #241C22, #120E12);
  }
  .lamp{ position:absolute; right:18px; bottom:14px; width:60px; height:130px; }
  .lamp-base{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:34px; height:7px; border-radius:50%;
    background:linear-gradient(180deg, #3a2e22, #1c1610);
  }
  .lamp-pole{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%) rotate(-3deg);
    width:5px; height:76px; border-radius:3px;
    background:linear-gradient(90deg, #6b5233, #a5793f, #6b5233);
  }
  .lamp-shade{
    position:absolute; top:8px; left:50%; transform:translateX(-50%) rotate(8deg);
    width:0; height:0;
    border-left:26px solid transparent;
    border-right:14px solid transparent;
    border-bottom:34px solid #7a5a30;
    filter:brightness(0.65);
    transition:filter 1s ease;
    transform-origin:bottom center;
  }
  .room.lit .lamp-shade{ filter:brightness(1.15); }
  .lamp-switch{
    position:absolute; top:16px; left:calc(50% + 14px);
    width:6px; height:6px; border-radius:50%;
    background:var(--slate);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .room.lit .lamp-switch{ background:var(--amber); box-shadow:0 0 8px 2px rgba(232,163,77,0.7); }
  .lamp-glow{
    position:absolute; top:-70px; left:50%; transform:translate(-50%,0) scale(0.4);
    width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, rgba(232,163,77,0.55) 0%, rgba(232,163,77,0.18) 35%, transparent 70%);
    opacity:0;
    transition:opacity 1s ease, transform 1.1s cubic-bezier(.16,1,.3,1);
    pointer-events:none;
  }
  .room.lit .lamp-glow{ opacity:1; transform:translate(-50%,0) scale(1); }
  .lamp-flicker{ animation:flicker 0.4s steps(3) 2; }
  @keyframes flicker{
    0%,100%{ opacity:1; } 40%{ opacity:0.4; } 70%{ opacity:0.85; }
  }

  /* ---------- CHARACTER ---------- */
  .character{
    position:absolute; bottom:24%; left:-90px;
    width:52px; height:112px;
    transform:translate3d(0,0,0);
    transition:opacity 1s ease;
    z-index:5;
  }
  .char-shadow{
    position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
    width:46px; height:10px; border-radius:50%;
    background:rgba(0,0,0,0.5); filter:blur(3px);
  }
  .body-wrap{
    position:absolute; inset:0;
    transition:transform 1s cubic-bezier(.16,1,.3,1);
    transform-style:preserve-3d;
  }
  .body-bob{ animation:bob 0.5s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  .head{
    position:absolute; top:0; left:9px; width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #EAD0A8, #C9A16E 65%, #97754C 100%);
  }
  .torso{
    position:absolute; top:27px; left:11px; width:28px; height:38px; border-radius:9px;
    background:linear-gradient(135deg, var(--wine-bright), var(--wine));
    box-shadow:inset -4px 0 8px rgba(0,0,0,0.3);
  }
  .arm{
    position:absolute; top:30px; width:9px; height:32px; border-radius:5px;
    background:linear-gradient(180deg, #C9A16E, #97754C);
    transform-origin:top center;
  }
  .arm-left{ left:4px; transform:rotate(12deg); animation:swingL 0.5s ease-in-out infinite; }
  .arm-right{ right:4px; transform:rotate(-12deg); animation:swingR 0.5s ease-in-out infinite; }
  @keyframes swingL{ 0%,100%{ transform:rotate(22deg); } 50%{ transform:rotate(-18deg); } }
  @keyframes swingR{ 0%,100%{ transform:rotate(-22deg); } 50%{ transform:rotate(18deg); } }
  .leg{
    position:absolute; top:62px; width:10px; height:34px; border-radius:5px;
    background:linear-gradient(180deg, #2A222C, #17121A);
    transform-origin:top center;
  }
  .leg-left{ left:9px; }
  .leg-right{ right:9px; }
  .walking .leg-left{ animation:legL 0.5s ease-in-out infinite; }
  .walking .leg-right{ animation:legR 0.5s ease-in-out infinite; }
  @keyframes legL{ 0%,100%{ transform:rotate(-26deg); } 50%{ transform:rotate(26deg); } }
  @keyframes legR{ 0%,100%{ transform:rotate(26deg); } 50%{ transform:rotate(-26deg); } }

  .character.walking{ animation:walkAcross 3s cubic-bezier(.45,.05,.55,.95) forwards; }
  @keyframes walkAcross{
    from{ left:-90px; }
    to{ left:calc(100% - 265px); }
  }
  .character.arrived .body-wrap{ transform:rotateY(28deg); }
  .character.arrived .arm-left, .character.arrived .arm-right{ animation:none; transform:rotate(6deg); }
  .character.arrived .leg-left, .character.arrived .leg-right{ animation:none; transform:rotate(0deg); }
  .character.reach .arm-right{ animation:none; transform:rotate(-118deg) translateX(2px); transition:transform .55s cubic-bezier(.34,1.56,.64,1); }
  .character.faded{ opacity:0.28; }

  /* ---------- LOGIN CARD ---------- */
  .login-wrap{
    position:relative; z-index:10;
    opacity:0; transform:translateY(28px) scale(0.98);
    transition:opacity 1s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1);
    pointer-events:none;
  }
  .login-wrap.on{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .login-card{
    width:380px; max-width:88vw;
    background:var(--card-glass-bg);
    border:1px solid var(--line-strong);
    border-radius:16px;
    padding:38px 34px;
    backdrop-filter:blur(16px);
    box-shadow:0 40px 90px -30px rgba(0,0,0,0.55), 0 0 0 1px rgba(232,163,77,0.05);
  }
  .login-card .logo{ display:inline-block; margin-bottom:26px; font-size:22px; }
  .login-card h1{ font-size:27px; margin-bottom:8px; }
  .login-card .sub{ color:var(--slate); font-size:14px; margin-bottom:28px; }
  .login-card .alt{ margin-top:20px; text-align:center; font-size:13.5px; color:var(--slate); }
  .login-card .alt a{ color:var(--rose); }
  .login-card .alt a:hover{ text-decoration:underline; }
  .forgot{ text-align:right; margin:-10px 0 22px; }
  .forgot a{ font-size:12.5px; color:var(--slate); }
  .forgot a:hover{ color:var(--rose); }

  @media (prefers-reduced-motion: reduce){
    .character{ display:none; }
  }
  @media (max-width: 640px){
    .desk, .lamp{ display:none; }
    .character{ display:none; }
  }
</style>
</head>
<body>

<button class="skip-btn" id="skipBtn">Skip intro →</button>
<button class="sound-toggle" id="soundToggle" type="button" aria-label="Toggle sound" style="position:fixed; top:26px; right:150px; z-index:60;">🔊</button>
<button class="theme-toggle" data-theme-toggle type="button" aria-label="Toggle theme" style="position:fixed; top:26px; right:196px; z-index:60;">🌙</button>

<div class="stage">
  <div class="room" id="room">
    <div class="backdrop"></div>
    <div class="stars" id="stars"></div>
    <div class="floor"></div>
    <div class="desk">
      <div class="lamp" id="lamp">
        <div class="lamp-base"></div>
        <div class="lamp-pole"></div>
        <div class="lamp-shade"></div>
        <div class="lamp-switch"></div>
        <div class="lamp-glow"></div>
      </div>
    </div>
    <div class="character" id="character">
      <div class="char-shadow"></div>
      <div class="body-wrap" id="bodyWrap">
        <div class="head"></div>
        <div class="torso"></div>
        <div class="arm arm-left"></div>
        <div class="arm arm-right" id="armRight"></div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
      </div>
    </div>
  </div>

  <div class="login-wrap" id="loginWrap">
    <div class="login-card">
      <a href="index.html" class="logo serif" style="font-style:italic;">Bleed<span class="dot">.</span></a>
      <h1>Welcome back</h1>
      <p class="sub">Log in to see what's draining you this month.</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@email.com" required>
        </div>
        <div class="field" style="margin-bottom:8px;">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required>
        </div>
        <div class="forgot"><a href="#">Forgot password?</a></div>
        <p class="form-error" id="loginError" style="color:var(--rose); font-size:13px; margin-bottom:14px; display:none;"></p>
        <button type="submit" class="btn-primary btn-block">Log in</button>
      </form>
      <p class="alt">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</div>

<script>
  const room = document.getElementById('room');
  const character = document.getElementById('character');
  const bodyWrap = document.getElementById('bodyWrap');
  const loginWrap = document.getElementById('loginWrap');
  const skipBtn = document.getElementById('skipBtn');
  const starsWrap = document.getElementById('stars');

  // scatter faint ambient stars/dust
  for(let s = 0; s < 26; s++){
    const dot = document.createElement('span');
    dot.style.left = Math.random() * 100 + '%';
    dot.style.top = Math.random() * 55 + '%';
    dot.style.opacity = (Math.random() * 0.4 + 0.1).toFixed(2);
    starsWrap.appendChild(dot);
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isSmall = window.innerWidth <= 640;
  let timers = [];
  const after = (ms, fn) => timers.push(setTimeout(fn, ms));

  function playIntro(){
    character.classList.add('walking');
    bodyWrap.classList.add('body-bob');

    after(3000, () => {
      character.classList.remove('walking');
      bodyWrap.classList.remove('body-bob');
      character.classList.add('arrived');
    });

    after(3200, () => character.classList.add('reach'));

    after(3750, () => {
      room.classList.add('lit');
      document.getElementById('lamp').classList.add('lamp-flicker');
      BleedSound.click();
      setTimeout(() => BleedSound.hum(), 120);
    });

    after(4300, () => {
      character.classList.add('faded');
      loginWrap.classList.add('on');
    });

    after(4600, () => document.getElementById('email').focus());
  }

  function skipToEnd(){
    timers.forEach(clearTimeout);
    timers = [];
    character.classList.remove('walking', 'reach');
    bodyWrap.classList.remove('body-bob');
    character.classList.add('arrived', 'faded');
    room.classList.add('lit');
    loginWrap.classList.add('on');
    BleedSound.unlock();
    BleedSound.click();
    setTimeout(() => BleedSound.hum(), 120);
    document.getElementById('email').focus();
  }

  skipBtn.addEventListener('click', skipToEnd);

  // First interaction anywhere unlocks audio, so the intro's lamp sound
  // has the best chance of not being silently blocked by autoplay policy.
  document.addEventListener('pointerdown', () => BleedSound.unlock(), { once: true });
  document.addEventListener('keydown', () => BleedSound.unlock(), { once: true });

  const soundToggle = document.getElementById('soundToggle');
  function updateSoundToggle(){
    const on = BleedSound.isEnabled();
    soundToggle.textContent = on ? '🔊' : '🔇';
    soundToggle.classList.toggle('muted', !on);
  }
  updateSoundToggle();
  soundToggle.addEventListener('click', () => {
    BleedSound.unlock();
    BleedSound.setEnabled(!BleedSound.isEnabled());
    updateSoundToggle();
  });

  if(reduceMotion || isSmall){
    skipToEnd();
  } else {
    after(500, playIntro);
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const errorEl = document.getElementById('loginError');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    errorEl.style.display = 'none';
    btn.textContent = 'Logging in…';
    btn.style.opacity = '0.75';
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Something went wrong.');
      }

      btn.textContent = 'Welcome back!';
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
      btn.textContent = 'Log in';
      btn.style.opacity = '1';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>

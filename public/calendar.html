<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Bleed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
<script src="sound.js"></script>
<style>
  .app-nav .wrap{ height:72px; }
  .app-nav .nav-links a.active{ color:var(--paper); position:relative; }
  .app-nav .nav-links a.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-26px; height:2px; background:var(--wine-bright);
  }

  .page{ padding:44px 0 90px; }
  .page-head{ margin-bottom:34px; }
  .page-head h1{ font-size:32px; }
  .page-head p{ color:var(--slate); font-size:14.5px; margin-top:6px; }

  @keyframes riseIn{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:translateY(0); } }
  .rise{ opacity:0; animation:riseIn .7s cubic-bezier(.16,1,.3,1) forwards; }

  .cal-layout{ display:grid; grid-template-columns:1.4fr 1fr; gap:20px; align-items:start; }
  .panel{ background:var(--ink-2); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--line); }
  .panel-head h2{ font-size:17px; }

  .renewal-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 24px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .renewal-row:last-child{ border-bottom:none; }
  .renewal-row .date{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--rose); }
  .renewal-row .badge{
    font-size:10px; font-family:'IBM Plex Mono', monospace; letter-spacing:0.04em;
    color:var(--amber); background:rgba(232,163,77,0.14); border:1px solid rgba(232,163,77,0.3);
    padding:2px 7px; border-radius:20px; margin-left:8px;
  }
  .empty-note{ padding:24px; color:var(--slate); font-size:13.5px; text-align:center; }

  @media (max-width: 900px){
    .cal-layout{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<nav class="site-nav app-nav">
  <div class="wrap">
    <a href="index.html" class="logo">Bleed<span class="dot">.</span></a>
    <div class="nav-links" id="navLinks">
      <a href="dashboard.html">Dashboard</a>
      <a href="dashboard.html">Subscriptions</a>
      <a href="calendar.html" class="active">Calendar</a>
      <div class="avatar-wrap">
        <button class="avatar" id="avatarBtn" type="button" style="border:none; cursor:pointer;">··</button>
        <div class="avatar-menu" id="avatarMenu">
          <div class="avatar-menu-header">
            <div class="name" id="menuName">—</div>
            <div class="email" id="menuEmail">—</div>
          </div>
          <a href="profile.html">View profile</a>
          <button type="button" id="menuLogout" class="danger">Log out</button>
        </div>
      </div>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="Toggle sound">🔊</button>
      <button class="theme-toggle" data-theme-toggle type="button" aria-label="Toggle theme">🌙</button>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
  </div>
</nav>

<main class="wrap page">
  <div class="page-head rise">
    <h1>Calendar</h1>
    <p>Every upcoming renewal, laid out by day.</p>
  </div>

  <div class="cal-layout">
    <div class="panel rise" style="animation-delay:.05s" id="calendarPanel">
      <div class="calendar-head">
        <span class="month-label" id="calMonthLabel">—</span>
        <div class="calendar-nav">
          <button type="button" id="calPrev" aria-label="Previous month">‹</button>
          <button type="button" id="calNext" aria-label="Next month">›</button>
        </div>
      </div>
      <div class="calendar-grid">
        <div class="calendar-dow">
          <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div class="calendar-days" id="calDays"></div>
      </div>
    </div>

    <div class="panel rise" style="animation-delay:.12s">
      <div class="panel-head"><h2>Upcoming renewals</h2></div>
      <div class="renewal-row"><span>Netflix Premium</span><span class="date">Jul 28</span></div>
      <div class="renewal-row"><span>Adobe CC</span><span class="date">Aug 2</span></div>
      <div class="renewal-row"><span>Notion Plus</span><span class="date">Aug 9</span></div>
      <div id="dynamicRenewals"></div>
    </div>
  </div>
</main>

<div class="toast-stack" id="toastStack"></div>

<script>
  // ---- Auth guard ----
  (async function checkAuth(){
    try {
      const res = await fetch('/api/auth/me', { credentials: 'include' });
      if (!res.ok) throw new Error('not logged in');
      const data = await res.json();
      const user = data.user;
      const initials = (user.firstName[0] + (user.lastName[0] || '')).toUpperCase();
      document.getElementById('avatarBtn').textContent = initials;
      document.getElementById('menuName').textContent = `${user.firstName} ${user.lastName}`;
      document.getElementById('menuEmail').textContent = user.email;
    } catch (err) {
      window.location.href = 'login.html';
    }
  })();

  async function doLogout(){
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
    window.location.href = 'login.html';
  }
  document.getElementById('menuLogout').addEventListener('click', doLogout);

  // ---- Avatar dropdown ----
  const avatarBtn = document.getElementById('avatarBtn');
  const avatarMenu = document.getElementById('avatarMenu');
  avatarBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    avatarMenu.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!avatarMenu.contains(e.target) && e.target !== avatarBtn) {
      avatarMenu.classList.remove('open');
    }
  });

  // ---- Mobile nav toggle ----
  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });

  // ---- Sound toggle ----
  const soundToggle = document.getElementById('soundToggle');
  function updateSoundToggle(){
    const on = BleedSound.isEnabled();
    soundToggle.textContent = on ? '🔊' : '🔇';
    soundToggle.classList.toggle('muted', !on);
  }
  updateSoundToggle();
  soundToggle.addEventListener('click', () => {
    BleedSound.unlock();
    BleedSound.setEnabled(!BleedSound.isEnabled());
    updateSoundToggle();
  });

  // ---- Load AI-detected / manually-added subscriptions with renewal dates ----
  let aiSubs = [];
  async function loadSubscriptions(){
    try {
      const res = await fetch('/api/scan/subscriptions', { credentials: 'include' });
      if(!res.ok) return;
      const data = await res.json();
      aiSubs = (data.subscriptions || []).filter(s => s.nextRenewal);

      const dynamicWrap = document.getElementById('dynamicRenewals');
      if(aiSubs.length === 0) return;
      dynamicWrap.innerHTML = aiSubs.map(s => `
        <div class="renewal-row">
          <span>${s.vendor}${s.source === 'manual' ? '<span class="badge" style="color:var(--slate); background:rgba(154,151,160,0.14); border-color:rgba(154,151,160,0.3);">MANUAL</span>' : '<span class="badge">AI</span>'}</span>
          <span class="date">${new Date(s.nextRenewal + 'T00:00:00').toLocaleDateString('en-IN', { month: 'short', day: 'numeric' })}</span>
        </div>
      `).join('');
    } catch(e){ /* calendar still works with the static demo list */ }
    renderCalendar();
  }

  // ---- Calendar ----
  function parseDemoDate(label){
    const year = new Date().getFullYear();
    const parsed = new Date(`${label} ${year}`);
    return isNaN(parsed) ? null : parsed;
  }

  let calDate = new Date();
  const calDays = document.getElementById('calDays');
  const calMonthLabel = document.getElementById('calMonthLabel');

  function collectRenewalsByDay(){
    const map = {};
    function addEntry(date, name){
      if(!date || isNaN(date)) return;
      const key = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
      if(!map[key]) map[key] = [];
      if(!map[key].includes(name)) map[key].push(name);
    }
    document.querySelectorAll('.renewal-row').forEach(row => {
      const name = row.querySelector('span:first-child')?.childNodes[0]?.textContent?.trim();
      const label = row.querySelector('.date')?.textContent;
      if(name && label) addEntry(parseDemoDate(label), name);
    });
    return map;
  }

  function renderCalendar(){
    const year = calDate.getFullYear();
    const month = calDate.getMonth();
    calMonthLabel.textContent = calDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const renewalsByDay = collectRenewalsByDay();
    const today = new Date();

    calDays.innerHTML = '';
    for(let i = 0; i < firstDay; i++){
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      calDays.appendChild(empty);
    }
    for(let d = 1; d <= daysInMonth; d++){
      const cell = document.createElement('div');
      const key = `${year}-${month}-${d}`;
      const names = renewalsByDay[key];
      const isToday = d === today.getDate() && month === today.getMonth() && year === today.getFullYear();
      cell.className = 'cal-day' + (isToday ? ' today' : '') + (names ? ' has-renewal' : '');
      cell.innerHTML = `${d}${names ? '<span class="cal-dot"></span>' : ''}`;
      if(names){
        const tip = document.createElement('div');
        tip.className = 'cal-tooltip';
        tip.textContent = names.join(', ') + ' renews';
        cell.appendChild(tip);
      }
      calDays.appendChild(cell);
    }
  }
  document.getElementById('calPrev').addEventListener('click', () => {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() - 1, 1);
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() + 1, 1);
    renderCalendar();
  });

  loadSubscriptions();

  // ---- Scroll reveal ----
  document.querySelectorAll('.rise').forEach((el, i) => { el.style.animationDelay = (i * 0.06) + 's'; });
</script>
</body>
</html>
